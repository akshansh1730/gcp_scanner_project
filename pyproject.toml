[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gcpscan"
version = "0.1.0"
description = "Read-only CIS Google Cloud Platform Foundations Benchmark scanner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gcpscan = "gcpscan.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gcpscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
